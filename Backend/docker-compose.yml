version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prepvr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepvr
      POSTGRES_PASSWORD: prepvr_password
      POSTGRES_DB: prepvr_placement
    ports:
      - "5432:5432"
    volumes:
      - prepvr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepvr -d prepvr_placement"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prepvr_pgdata:
    driver: local
